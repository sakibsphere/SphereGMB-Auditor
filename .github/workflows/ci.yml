name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint, syntax/manifest check, unit + DOM + review-dialog tests
        run: npm run verify
      - name: Build extension zip
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: sphere-gmb-extension
          path: dist/*.zip

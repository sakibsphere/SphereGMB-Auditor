name: Release

# Push a tag like v1.5.0 to publish a GitHub Release with the ready-to-load extension zip.
#   git tag v1.5.0
#   git push origin v1.5.0

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and tests
        run: npm run verify
      - name: Check the tag matches manifest.json
        run: |
          v=$(node -p "require('./manifest.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} does not match manifest version v$v"; exit 1; fi
      - name: Build the extension zip
        run: |
          npm run package
          cp dist/sphere-gmb-v*.zip dist/sphere-gmb.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2)
          # Re-pushing a tag refreshes the existing release instead of failing.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/sphere-gmb-v*.zip dist/sphere-gmb.zip --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "SphereGMB ${GITHUB_REF_NAME}" --notes "${notes}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/sphere-gmb-v*.zip dist/sphere-gmb.zip \
              --title "SphereGMB ${GITHUB_REF_NAME}" --notes "${notes}"
          fi
